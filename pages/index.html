<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expérience de Stroop</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
    <!-- Pour afficher le X rouge au centre de l'écran lorsque le participant se trompe -->
    <span id="feedback-symbol" style="display: none;"></span>
    <p id="display-text" style="display: none;"></p>
    
    <!-- Création d'un bloc pricnipal englobant le bouton start et les boutons réponses pour les centrer dans le fichier shared.css-->
    <div id="main-container">
        <div id="start-button">START</div>
        <div class="arc-container">
            <div class="response-box" id="rouge">ROUGE</div>
            <div class="response-box" id="bleu">BLEU</div>
            <div class="response-box" id="jaune">JAUNE</div>
            <div class="response-box" id="vert">VERT</div>
        </div>
    </div>
    <script src="../scripts/stimuli.js" defer></script>

</body>
</html>
